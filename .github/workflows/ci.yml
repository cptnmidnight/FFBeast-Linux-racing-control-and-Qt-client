name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-configurator:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libusb-1.0-0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/configurator/src-tauri

      - name: Verify package-lock.json exists
        working-directory: apps/configurator
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: package-lock.json not found in apps/configurator"
            echo "Please commit package-lock.json to the repository"
            exit 1
          fi

      - name: Install dependencies
        working-directory: apps/configurator
        run: npm ci

      - name: Lint frontend
        working-directory: apps/configurator
        run: npm run lint || true

      - name: Type check
        working-directory: apps/configurator
        run: npm run type-check || true

      - name: Build configurator
        working-directory: apps/configurator
        run: npm run tauri build -- --bundles deb

  test-launcher:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libusb-1.0-0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Verify package-lock.json exists
        working-directory: launcher
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Error: package-lock.json not found in launcher"
            echo "Please commit package-lock.json to the repository"
            exit 1
          fi

      - name: Install dependencies
        working-directory: launcher
        run: npm ci

      - name: Build launcher
        working-directory: launcher
        run: npm run tauri build -- --bundles deb
