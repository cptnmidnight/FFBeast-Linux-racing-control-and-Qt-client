name: Release Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
    branches:
      - master

jobs:
  build-configurator-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: apps/configurator
        run: npm install

      - name: Build Configurator (Windows)
        working-directory: apps/configurator
        run: npm run tauri -- build

      - name: Prepare Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "apps/configurator/src-tauri/target/release/*.exe" -Destination staging
          Copy-Item "apps/configurator/src-tauri/target/release/bundle/nsis/*.exe" -Destination staging
          Copy-Item "apps/configurator/src-tauri/target/release/bundle/msi/*.msi" -Destination staging

      - name: Upload Configurator Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: configurator-windows
          path: staging/*

  build-configurator-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libusb-1.0-0-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: apps/configurator
        run: npm install

      - name: Build Configurator (Linux)
        working-directory: apps/configurator
        # Explicitly request targets. Note: Flatpak requires extra setup/manifest usually not auto-generated by simple CLI flags without config.
        # We build AppImage, Deb, RPM here.
        run: npm run tauri -- build --bundles appimage,deb,rpm

      - name: Prepare Linux Artifacts
        run: |
          mkdir staging
          find apps/configurator/src-tauri/target/release/bundle -name "*.AppImage" -exec cp {} staging/ \;
          find apps/configurator/src-tauri/target/release/bundle -name "*.deb" -exec cp {} staging/ \;
          find apps/configurator/src-tauri/target/release/bundle -name "*.rpm" -exec cp {} staging/ \;

      - name: Upload Configurator Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: configurator-linux
          path: staging/*

  release:
    needs: [build-configurator-windows, build-configurator-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
        contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/configurator-windows/*
            artifacts/configurator-linux/*
          generate_release_notes: true
