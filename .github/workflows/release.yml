name: Release Pipeline

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-configurator-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: apps/configurator
        run: npm ci

      - name: Build Configurator (Windows)
        working-directory: apps/configurator
        run: npm run tauri build

      - name: Upload Configurator Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: configurator-windows
          path: |
            apps/configurator/src-tauri/target/release/ffbeast-ui.exe
            apps/configurator/src-tauri/target/release/bundle/nsis/*.exe
            apps/configurator/src-tauri/target/release/bundle/msi/*.msi

  build-configurator-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libusb-1.0-0-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: apps/configurator
        run: npm ci

      - name: Build Configurator (Linux)
        working-directory: apps/configurator
        # Explicitly request targets. Note: Flatpak requires extra setup/manifest usually not auto-generated by simple CLI flags without config.
        # We build AppImage, Deb, RPM here.
        run: npm run tauri build -- --bundles appimage,deb,rpm

      - name: Upload Configurator Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: configurator-linux
          path: |
            apps/configurator/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/configurator/src-tauri/target/release/bundle/deb/*.deb
            apps/configurator/src-tauri/target/release/bundle/rpm/*.rpm

  build-launcher-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libusb-1.0-0-dev rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: launcher
        run: npm ci

      - name: Build Launcher (Linux)
        working-directory: launcher
        run: npm run tauri build -- --bundles appimage,deb,rpm

      - name: Upload Launcher Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux
          path: |
            launcher/src-tauri/target/release/bundle/appimage/*.AppImage
            launcher/src-tauri/target/release/bundle/deb/*.deb
            launcher/src-tauri/target/release/bundle/rpm/*.rpm

  release:
    needs: [build-configurator-windows, build-configurator-linux, build-launcher-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/configurator-windows/ffbeast-ui.exe
            artifacts/configurator-windows/*.exe
            artifacts/configurator-windows/*.msi
            artifacts/configurator-linux/*.AppImage
            artifacts/configurator-linux/*.deb
            artifacts/configurator-linux/*.rpm
            artifacts/launcher-linux/*.AppImage
            artifacts/launcher-linux/*.deb
            artifacts/launcher-linux/*.rpm
          generate_release_notes: true
