name: Backend Checks

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  check-rust-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test controller
        run: cargo test -p ffbeast-controller

      - name: Check service crates
        run: cargo check -p ffbeast-backend-api -p ffbeast-service
