<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SODevs Game Launcher</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <div id="app" class="container">
        <header>
            <h1 data-i18n="app.title">SODevs Game Launcher</h1>
            <div class="header-controls">
                <select id="lang-selector" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="pt">Português</option>
                </select>
                <div id="status-display" class="hardware-badge" data-i18n="app.searching">
                    Searching for hardware...
                </div>
                <button onclick="openAdvancedConfig()" class="btn-secondary"
                    style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">⚙️</button>
            </div>
        </header>

        <main>
            <!-- Hardware Monitor -->
            <div class="monitor-section">
                <div class="card monitor-card">
                    <div id="wheel-visual-container">
                        <div id="wheel-visual-inner">
                            <div class="wheel-spoke-pro" style="transform: rotate(0deg);"></div>
                            <div class="wheel-spoke-pro" style="transform: rotate(120deg);"></div>
                            <div class="wheel-spoke-pro" style="transform: rotate(240deg);"></div>
                        </div>
                    </div>
                    <div class="monitor-data">
                        <div class="data-item">
                            <span class="label" data-i18n="monitor.position">Position</span>
                            <span id="pos-val" class="value">0</span>
                        </div>
                        <div class="data-item">
                            <span class="label" data-i18n="monitor.torque">Torque</span>
                            <span id="torque-val" class="value">0</span>
                        </div>
                    </div>
                    <div class="monitor-actions">
                        <button onclick="invokeResetCenter()" class="btn-secondary"
                            data-i18n="monitor.reset_center">Reset Center</button>
                        <button onclick="invokeReboot()" class="btn-danger" data-i18n="monitor.reboot">Reboot
                            Device</button>
                    </div>
                </div>
            </div>

            <section class="config-section card">
                <h2 data-i18n="config.title">Wheel Configuration</h2>
                <div class="slider-grid">
                    <div class="slider-item">
                        <label data-i18n="config.total_force">Total Force</label>
                        <input type="range" id="total-force-slider" min="0" max="100" value="100"
                            oninput="debounceUpdateSettings()">
                        <span id="total-force-val">100%</span>
                    </div>
                    <div class="slider-item">
                        <label data-i18n="config.motion_range">Motion Range</label>
                        <input type="range" id="motion-range-slider" min="180" max="1080" step="10" value="900"
                            oninput="debounceUpdateSettings()">
                        <span id="motion-range-val">900°</span>
                    </div>
                    <div class="slider-item">
                        <label data-i18n="config.dynamic_damp">Dynamic Dampening</label>
                        <input type="range" id="dynamic-damp-slider" min="0" max="1000" value="0"
                            oninput="debounceUpdateSettings()">
                        <span id="dynamic-damp-val">0</span>
                    </div>
                </div>
            </section>

            <section class="library-section">
                <div class="section-header">
                    <h2 data-i18n="library.title">Your Library</h2>
                    <button onclick="openAddGameModal()" class="btn-primary" data-i18n="library.add_game">+ Add
                        Game</button>
                </div>
                <div id="game-list" class="game-grid">
                    <!-- Games from logic -->
                </div>
            </section>
        </main>

        <!-- Add Game Modal -->
        <div id="add-game-modal" class="modal">
            <div class="modal-content">
                <h2 data-i18n="library.add_game">Add New Game</h2>
                <div class="form-group">
                    <label data-i18n="library.game_name">Game Name</label>
                    <input type="text" id="game-name-input" placeholder="e.g. Assetto Corsa">
                </div>
                <div class="form-group">
                    <label data-i18n="library.game_path">Executable Path</label>
                    <input type="text" id="game-path-input" placeholder="C:\Games\Game.exe">
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label data-i18n="config.motion_range">Motion Range</label>
                        <input type="number" id="game-range-input" value="900">
                    </div>
                    <div class="form-group">
                        <label data-i18n="config.total_force">Total Force (%)</label>
                        <input type="number" id="game-force-input" value="100">
                    </div>
                </div>
                <div class="modal-actions">
                    <button onclick="closeAddGameModal()" class="btn-secondary" data-i18n="app.cancel">Cancel</button>
                    <button onclick="saveNewGame()" class="btn-primary" data-i18n="app.save">Save Game</button>
                </div>
            </div>
        </div>

        <footer>
            <span data-i18n="app.footer">SODevs Game Launcher &copy; 2026 | Rust Migration Project</span>
        </footer>
    </div>

    <script type="module" src="/main.js"></script>
</body>

</html>
