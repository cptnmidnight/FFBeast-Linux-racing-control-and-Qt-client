[package]
name = "ffbeast-ui"
version = "0.1.0"
description = "SODevs Controller Configurator"
authors = ["SODevs"]
edition = "2021"

[lib]
name = "ffbeast_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ffbeast-controller = { path = "../../../libs/controller" }
enigo = "0.6.1"
